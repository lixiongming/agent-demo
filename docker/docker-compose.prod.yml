# ============================================
# Docker Compose - 生产环境配置
# ============================================
# 使用方式：
#   docker-compose -f docker-compose.prod.yml up -d --build
# ============================================

services:
  # API 服务（生产环境）
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    env_file:
      - ../.env
    ports:
      - "8888:8888"
    environment:
      # MySQL 配置
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=agent_db
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Qdrant 配置
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=knowledge_base
      # 生产环境标志
      - ENVIRONMENT=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      # 生产环境：只挂载日志和数据目录，不挂载代码
      - ../logs:/app/logs
      - ../models:/app/models:ro
    # 生产环境：多 worker，无热更新
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --workers 4
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    # 自动重启策略
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - agent_network
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=agent_db
    ports:
      - "3306:3306"
    volumes:
      - ../data/volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Redis 缓存（RDB+AOF混合持久化，启动快且数据安全）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ../data/volumes/redis:/data
    command: redis-server --appendonly yes --aof-use-rdb-preamble yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000 --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # MySQL 定时备份服务
  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    env_file:
      - ../.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=agent_db
    volumes:
      - ../data/backups:/app/data/backups
      - ../logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  agent_network:
    driver: bridge
