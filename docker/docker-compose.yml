services:
  # ============================================
  # API 服务
  # ============================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8888:8888"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=agent_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=knowledge_base
      - HISTORY_ENABLED=true
      - HISTORY_MODE=token
      - HISTORY_ROUNDS_LIMIT=10
      - HISTORY_TOKEN_LIMIT=16000
      - HISTORY_TOKEN_SAFETY_MARGIN=500
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data:ro
      # Dev: mount source for hot reload
      - ../app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/v1/health/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================
  # Qdrant 向量数据库
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================
  # MySQL 8.0
  # ============================================
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=agent_db
    volumes:
      - ../data/volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================
  # Redis 7 (cache-only, no persistence)
  # ============================================
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - agent_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

networks:
  agent_network:
    driver: bridge
