services:
  # API 服务
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env  # 使用项目根目录的 .env 文件
    ports:
      - "8888:8888"
    environment:
      # MySQL 配置（连接 Docker 内部 MySQL）
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=agent_db
      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Qdrant 配置
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=knowledge_base
      # 对话历史配置
      - HISTORY_ENABLED=true       # 是否加载历史消息
      - HISTORY_MODE=token         # 模式: rounds(按轮数) / token(按token数，推荐)
      - HISTORY_ROUNDS_LIMIT=10    # 轮数模式: 保留最近 N 轮对话（1轮=1问1答）
      - HISTORY_TOKEN_LIMIT=16000  # Token模式: 历史消息最大 token 数（32K上下文，预留一半给输出）
      - HISTORY_TOKEN_SAFETY_MARGIN=500  # Token 安全边界
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../logs:/app/logs
      - ../models:/app/models:ro
      # 开发模式：挂载代码目录（代码变化自动生效，无需重新构建）
      - ../app:/app/app
      - ../main.py:/app/main.py
      - ../run_server.py:/app/run_server.py
    # 开发模式：启用热更新（代码变化自动重载）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - agent_network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent_network

  # MySQL（使用 3306 端口避免与本地 MySQL 冲突）
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=agent_db
    ports:
      - "3306:3306"
    volumes:
      - ../data/volumes/mysql:/var/lib/mysql
      # 不再挂载 SQL 文件，让 init_db() 自动创建表结构（与本地一致）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agent_network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ../data/volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent_network

  # MySQL 定时备份服务
  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    env_file:
      - ../.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=agent_db
    volumes:
      - ../data/backups:/app/data/backups
      - ../logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent_network

networks:
  agent_network:
    driver: bridge