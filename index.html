<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - 智能对话系统</title>
    <style>
        /* ============================================
           科技感主题 - 深色赛博朋克风格
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色调 - 霓虹蓝 */
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.5);
            --primary-dark: #00a8b3;

            /* 辅助色 - 霓虹紫 */
            --secondary: #bf00ff;
            --secondary-glow: rgba(191, 0, 255, 0.5);

            /* 背景色 */
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a25;

            /* 文字色 */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* 边框色 */
            --border-color: #2a2a3a;
            --border-glow: rgba(0, 240, 255, 0.3);

            /* 成功/错误 */
            --success: #00ff88;
            --error: #ff3366;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(191, 0, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-dark) 0%, #0f0f1a 100%);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 主容器 */
        .container {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--primary-glow); }
            50% { box-shadow: 0 0 40px var(--primary-glow); }
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            color: var(--bg-dark);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .new-chat-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .new-chat-btn:hover::before {
            left: 100%;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .session-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .session-item:hover {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
        }

        .session-item.active {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.1);
            color: var(--text-primary);
        }

        /* 主聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--secondary), #8800cc);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .message-content {
            flex: 1;
            padding: 16px 20px;
            background: var(--bg-input);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, rgba(191, 0, 255, 0.1), rgba(136, 0, 204, 0.1));
            border-color: rgba(191, 0, 255, 0.3);
        }

        .message.assistant .message-content {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), rgba(0, 168, 179, 0.05));
            border-color: rgba(0, 240, 255, 0.2);
        }

        .message-content pre {
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border-color);
        }

        .message-content code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        /* 输入区域 */
        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            min-height: 52px;
            max-height: 200px;
            padding: 14px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            color: var(--bg-dark);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* 消息内 loading 动画 */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: loadingPulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loadingPulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .sidebar {
                display: none;
            }

            .chat-area {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景动画 -->
    <div class="bg-animation"></div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🤖</div>
                <div class="logo-text">AI Agent</div>
            </div>

            <button class="new-chat-btn" onclick="createNewSession()">
                ✨ 新建对话
            </button>

            <div class="session-list" id="sessionList">
                <!-- 会话列表 -->
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title">智能对话助手</div>
                <div class="chat-status">
                    <div class="status-dot"></div>
                    <span>在线</span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- 欢迎消息 -->
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        你好！我是 AI Agent 智能助手。我可以帮你：
                        <br><br>
                        ✨ 回答各种问题<br>
                        📚 查询知识库信息<br>
                        🔧 调用各种工具<br>
                        💡 提供建议和帮助<br>
                        <br>
                        请问有什么可以帮你的？
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea
                            class="chat-input"
                            id="chatInput"
                            placeholder="输入你的问题..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                        ></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // API 配置
        // ============================================
        const API_BASE = 'http://localhost:8888/api/v1';

        // ============================================
        // 状态管理
        // ============================================
        let currentSessionId = null;
        let isStreaming = false;

        // ============================================
        // 初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // 自动调整输入框高度
            const input = document.getElementById('chatInput');
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });

            // 加载会话列表，选择最近的会话
            loadSessionList();
        });

        async function loadSessionList() {
            try {
                const response = await fetch(`${API_BASE}/sessions/list?page=1&page_size=10`);
                const data = await response.json();

                if (data.code === 1000 && data.data.list.length > 0) {
                    // 渲染会话列表
                    const list = document.getElementById('sessionList');
                    list.innerHTML = '';

                    data.data.list.forEach((session, index) => {
                        const item = document.createElement('div');
                        item.className = 'session-item' + (index === 0 ? ' active' : '');
                        item.textContent = session.title || `对话 ${session.session_id.substring(0, 8)}...`;
                        item.onclick = () => switchSession(session.session_id);
                        list.appendChild(item);
                    });

                    // 加载最近的会话
                    currentSessionId = data.data.list[0].session_id;
                    loadSessionHistory(currentSessionId);
                } else {
                    // 没有会话，创建新的
                    createNewSession();
                }
            } catch (error) {
                console.error('加载会话列表失败:', error);
                // 出错时创建新会话
                createNewSession();
            }
        }

        // ============================================
        // 会话管理
        // ============================================
        async function createNewSession() {
            try {
                console.log('创建新会话...');
                const response = await fetch(`${API_BASE}/sessions/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(
                    {
                        agent_type: 'chat',
                        model_name: 'qwen3-max'
                    })
                });

                const data = await response.json();
                console.log('创建会话响应:', data);

                if (data.code === 1000) {
                    currentSessionId = data.data.session_id;

                    // 添加到会话列表
                    addSessionToList(currentSessionId);

                    // 清空消息
                    clearMessages();

                    console.log('新会话创建成功:', currentSessionId);
                } else {
                    console.error('创建会话失败:', data);
                    alert('创建会话失败: ' + data.message);
                }
            } catch (error) {
                console.error('创建会话失败:', error);
                alert('创建会话失败，请检查后端服务是否运行');
            }
        }

        function addSessionToList(sessionId) {
            const list = document.getElementById('sessionList');
            const item = document.createElement('div');
            item.className = 'session-item active';
            item.textContent = `对话 ${sessionId.substring(0, 8)}...`;
            item.onclick = () => switchSession(sessionId);

            // 移除其他活跃状态
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.remove('active');
            });

            list.insertBefore(item, list.firstChild);
        }

        function switchSession(sessionId) {
            currentSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.remove('active');
            });
            event.target.classList.add('active');
            loadSessionHistory(sessionId);
        }

        async function loadSessionHistory(sessionId) {
            try {
                const response = await fetch(`${API_BASE}/chat/history/${sessionId}`);
                const data = await response.json();

                if (data.code === 1000) {
                    clearMessages();
                    // 按创建时间排序，确保消息顺序正确
                    const messages = (data.data.messages || []).sort((a, b) => {
                        const timeA = new Date(a.created_at || a.timestamp || 0).getTime();
                        const timeB = new Date(b.created_at || b.timestamp || 0).getTime();
                        return timeA - timeB;
                    });
                    messages.forEach(msg => {
                        addMessage(msg.role, msg.content);
                    });
                }
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }

        // ============================================
        // 消息处理
        // ============================================
        function clearMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
        }

        function addMessage(role, content) {
            const container = document.getElementById('chatMessages');
            const message = document.createElement('div');
            message.className = `message ${role}`;

            const avatar = role === 'user' ? '👤' : '🤖';

            message.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${formatContent(content)}</div>
            `;

            container.appendChild(message);
            scrollToBottom();
        }

        function addTypingIndicator() {
            const container = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';

            indicator.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;

            container.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function formatContent(content) {
            // 简单的 Markdown 格式化
            return content
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // 发送消息
        // ============================================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message || isStreaming) return;

            // 添加用户消息
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            isStreaming = true;

            try {
                // 使用流式接口
                await streamMessage(message);
            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage('assistant', '抱歉，发生了错误，请稍后重试。');
            }

            isStreaming = false;
        }

        async function streamMessage(message) {
            // 检查 session_id
            if (!currentSessionId) {
                console.error('没有有效的会话ID');
                addMessage('assistant', '请先创建会话');
                return;
            }

            console.log('发送消息:', { session_id: currentSessionId, message: message });

            const response = await fetch(`${API_BASE}/chat/message/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    message: message
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error('请求失败:', response.status, errorText);
                throw new Error(`请求失败: ${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // 创建助手消息容器
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            // 创建内容容器（不使用固定 id）
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
            `;
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);

            // 显示 loading 状态
            contentDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

            let fullContent = '';
            let firstChunk = true;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            if (json.content) {
                                // 收到第一个数据时移除 loading
                                if (firstChunk) {
                                    contentDiv.innerHTML = '';
                                    firstChunk = false;
                                }
                                fullContent += json.content;
                                contentDiv.innerHTML = formatContent(fullContent);
                                scrollToBottom();
                            }
                        } catch (e) {
                            // 忽略解析错误
                        }
                    }
                }
            }

            // 如果没有收到任何内容，显示提示
            if (fullContent === '') {
                contentDiv.innerHTML = '<span style="color: #999;">暂无响应</span>';
            }
        }

        // ============================================
        // 事件处理
        // ============================================
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
