[project]
name = "agent-demo"
version = "1.0.0"
description = "LangChain Agent 服务 - 大厂生产级架构"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Team", email = "team@example.com"}
]
keywords = ["fastapi", "langchain", "agent", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "PyJWT==2.10.1",
    "passlib==1.7.4",
    "bcrypt==4.3.0",
    "sqlalchemy==2.0.50",
    "alembic==1.13.1",
    "aiomysql==0.3.2",
    "pymysql==1.2.0",
    "cryptography>=42.0.0",
    "redis==8.0.0",
    "qdrant-client==1.12.1",
    "langchain==1.3.4",
    "langchain-openai==1.2.2",
    "langgraph==1.2.4",
    "langchain-core==1.4.1",
    "tiktoken==0.9.0",
    "numpy==1.26.4",
    "pypdf==6.13.0",
    "python-docx==1.2.0",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
agent-server = "app.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"